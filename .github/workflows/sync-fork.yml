name: Sync Fork and Setup Environment

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger button

jobs:
  sync-and-setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches full history for a smooth merge

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync and Merge Upstream Changes
        run: |
          # 1. Add upstream and fetch
          git remote add upstream https://github.com/lantern-eight/elegoo-printer-proxy
          git fetch upstream main
          
          # 2. Merge upstream updates into your fork
          git merge upstream/main --no-edit

      - name: Handle Configuration Files
        run: |
          # Flag to track if we made changes that need committing
          CHANGES_MADE=false
          
          # 1. Handle .env.example -> .env.cc2
          if [ -f ".env.example" ]; then
            echo "Found .env.example. Setting up .env.cc2..."
            mv -f .env.example .env.cc2
            
            # 2. Recode the PRINTER_IP variable inside .env.cc2
            # CHANGE '192.168.1.100' to your actual target printer IP address
            TARGET_IP="192.168.0.73"
            echo "Updating PRINTER_IP to $TARGET_IP..."
            sed -i "s|^PRINTER_IP=.*|PRINTER_IP=$TARGET_IP|g" .env.cc2
            
            git add -f .env.cc2
            CHANGES_MADE=true
          fi
          
          # 3. Handle docker-compose.example.yml -> docker-compose.yml
          if [ -f "docker-compose.example.yml" ]; then
            echo "Found docker-compose.example.yml. Setting up docker-compose.yml..."
            mv -f docker-compose.example.yml docker-compose.yml          
            
            # 4. Remove the entire cc1-proxy service section block
            # This looks for the service header 'cc1-proxy:' and deletes down to the next service block
            echo "Removing entire cc1-proxy container section..."
            sed -i '/cc1-proxy:/,/cc2-proxy:/ { /cc2-proxy:/!d }' docker-compose.yml
            
            # 5. Adjust the bind mount path inside docker-compose.yml
            # CHANGE '/old/path' and '/new/path' to match your actual requirements
            OLD_PATH="./gcode-archive"
            NEW_PATH="/mnt/user/appdata/elegoo-print-proxy"
            
            echo "Updating bind mount path from $OLD_PATH to $NEW_PATH..."
            sed -i "s|$OLD_PATH|$NEW_PATH|g" docker-compose.yml
            
            git add -f docker-compose.yml
            CHANGES_MADE=true
          fi
          
          # 7. Commit only if files were actually processed
          if [ "$CHANGES_MADE" = true ]; then
            git commit -m "Automated: Setup environment vars, stripped cc1 section, and updated paths"
          else
            echo "No template files found to process."
          fi

      - name: Push Combined Changes
        run: |
          # Pushes both the upstream merge and your file modifications together
          git push origin HEAD
