name: Sync Fork from Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily
  workflow_dispatch: # Allows manual trigger button

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetches all history so git can merge properly

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      - name: Sync and Merge Upstream Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Add the upstream remote pointer
          # CHANGE 'upstream-owner/upstream-repo' to the original repository's path (e.g., facebook/react)
          git remote add upstream https://github.com/lantern-eight/elegoo-printer-proxy
          
          # 2. Fetch upstream branches
          git fetch upstream main
          
          # 3. Merge upstream changes into your fork's active branch
          # This keeps your renamed file while pulling in their updates
          git merge upstream/main --no-edit
          
          # 4. Push the merged result back to your personal fork
          git push origin HEAD
